<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Dodger</title>
<style>
  body { background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#111; border:4px solid #555; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let ship={x:200,y:550},asteroids=[],score=0;
document.addEventListener("mousemove",e=>{ship.x=e.clientX-c.offsetLeft;});
function update(){
  if(Math.random()<0.03)asteroids.push({x:Math.random()*400,y:0,r:15});
  asteroids.forEach(a=>a.y+=4);
  asteroids=asteroids.filter(a=>a.y<600);
  asteroids.forEach(a=>{if(Math.hypot(ship.x-a.x,ship.y-a.y)<a.r+20){alert("Game Over! Score:"+score);score=0;asteroids=[];}});
  score++;
}
function draw(){
  ctx.clearRect(0,0,400,600);
  ctx.fillStyle="white";ctx.fillText("Score:"+score,10,20);
  ctx.fillStyle="cyan";ctx.fillRect(ship.x-20,ship.y-20,40,40);
  ctx.fillStyle="red";asteroids.forEach(a=>{ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill();});
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
