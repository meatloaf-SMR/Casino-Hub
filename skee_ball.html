<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skee Ball</title>
<style>
  body { background:#222; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#333; border:6px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let ball=null,score=0,shots=0;

// Define scoring rings
const rings = [
  {x:200,y:100,r:40,points:10},
  {x:200,y:80,r:25,points:20},
  {x:200,y:60,r:15,points:50},
  {x:200,y:40,r:10,points:100}
];

c.addEventListener("click",()=>{
  if(!ball && shots<10){ // 10 shots per round
    ball={x:200,y:550,vx:(Math.random()-0.5)*6,vy:-12,r:10};
    shots++;
  }
});

function update(){
  if(ball){
    ball.x+=ball.vx;
    ball.y+=ball.vy;
    ball.vy+=0.25; // gravity

    // Check scoring rings
    rings.forEach(r=>{
      if(ball && Math.hypot(ball.x-r.x,ball.y-r.y)<r.r){
        score+=r.points;
        ball=null;
      }
    });

    // Out of bounds
    if(ball && ball.y>600){ball=null;}
  }
}

function draw(){
  ctx.clearRect(0,0,400,600);
  ctx.fillStyle="white";
  ctx.font="16px sans-serif";
  ctx.fillText("Score: "+score,20,20);
  ctx.fillText("Shots: "+shots+"/10",300,20);

  // Draw rings
  rings.forEach(r=>{
    ctx.strokeStyle="yellow";
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle="white";
    ctx.fillText(r.points,r.x-10,r.y+5);
  });

  // Ball
  if(ball){
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fillStyle="red";
    ctx.fill();
  }

  // End of round
  if(shots>=10 && !ball){
    ctx.fillStyle="lime";
    ctx.font="24px sans-serif";
    ctx.fillText("Round Over!",140,300);
    ctx.font="16px sans-serif";
    ctx.fillText("Final Score: "+score,150,330);
    ctx.fillText("Click to Restart",150,360);
  }
}

c.addEventListener("click",()=>{
  if(shots>=10 && !ball){
    score=0;shots=0;ball=null;
  }
});

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
