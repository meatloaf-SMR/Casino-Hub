<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skee Ball</title>
<style>
  body { background:#222; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#333; border:6px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let ball=null,score=0;
c.addEventListener("click",()=>{ball={x:200,y:550,vx:(Math.random()-0.5)*6,vy:-10};});
function update(){
  if(ball){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=0.2;
    if(ball.y<100){score+=10;ball=null;}}
}
function draw(){
  ctx.clearRect(0,0,400,600);
  ctx.fillStyle="white";ctx.fillText("Score: "+score,20,20);
  ctx.strokeStyle="yellow";ctx.beginPath();ctx.arc(200,80,40,0,Math.PI*2);ctx.stroke();
  if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,10,0,Math.PI*2);ctx.fillStyle="red";ctx.fill();}
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
