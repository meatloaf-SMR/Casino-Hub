<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Knife Throw Spiral</title>
<style>
  body { background:#222; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#333; border:6px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let knives=[],targetAngle=0,score=0,gameOver=false;

c.addEventListener("click",()=>{
  if(!gameOver){
    knives.push({angle:targetAngle});
    for(let k of knives.slice(0,-1)){
      if(Math.abs(k.angle-targetAngle)<0.15){ // too close
        gameOver=true;
      }
    }
    if(!gameOver)score++;
  } else {
    knives=[];score=0;gameOver=false;
  }
});

function update(){
  targetAngle+=0.02; // target spins
}

function drawSpiral(){
  ctx.save();
  ctx.translate(200,200);
  ctx.rotate(targetAngle);
  ctx.strokeStyle="brown";
  ctx.lineWidth=3;
  ctx.beginPath();
  for(let t=0;t<Math.PI*6;t+=0.1){
    let r=10+t*5; // spiral radius grows
    let x=Math.cos(t)*r;
    let y=Math.sin(t)*r;
    ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,400,400);

  // Draw spiral target
  drawSpiral();

  // Draw knives
  ctx.fillStyle="silver";
  knives.forEach(k=>{
    const x=200+Math.cos(k.angle)*100;
    const y=200+Math.sin(k.angle)*100;
    ctx.fillRect(x-2,y-20,4,20);
  });

  // Score
  ctx.fillStyle="white";
  ctx.font="16px monospace";
  ctx.fillText("Score: "+score,20,20);

  // Game Over
  if(gameOver){
    ctx.fillStyle="yellow";
    ctx.font="24px monospace";
    ctx.fillText("GAME OVER",130,200);
    ctx.font="14px monospace";
    ctx.fillText("Click to Restart",140,230);
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
