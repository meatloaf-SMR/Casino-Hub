<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Knife Throw Spiral</title>
<style>
  body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#222; border:6px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let knives=[],targetAngle=0,score=0,gameOver=false,speed=0.02;

c.addEventListener("click",()=>{
  if(!gameOver){
    // Store knife relative to current rotation
    knives.push({angle:0}); 
    // Collision check (relative to rotation)
    for(let k of knives.slice(0,-1)){
      if(Math.abs(k.angle)<0.25){ // bigger hitbox
        gameOver=true;
      }
    }
    if(!gameOver){
      score++;
      speed+=0.005; // increase difficulty
    }
  } else {
    knives=[];score=0;gameOver=false;speed=0.02;
  }
});

function update(){
  targetAngle+=speed;
  // Update knife angles so they spin with target
  knives.forEach(k=>{k.angle+=speed;});
}

function drawSpiral(){
  ctx.save();
  ctx.translate(200,200);
  ctx.rotate(targetAngle);
  ctx.strokeStyle="brown";
  ctx.lineWidth=3;
  ctx.beginPath();
  for(let t=0;t<Math.PI*6;t+=0.1){
    let r=10+t*5;
    let x=Math.cos(t)*r;
    let y=Math.sin(t)*r;
    ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,400,400);

  // Spiral target
  drawSpiral();

  // Knives (spin with target)
  knives.forEach(k=>{
    const x=200+Math.cos(k.angle)*100;
    const y=200+Math.sin(k.angle)*100;
    ctx.fillStyle="silver";
    ctx.fillRect(x-3,y-30,6,30); // blade
    ctx.fillStyle="brown";
    ctx.fillRect(x-5,y,10,12); // handle
  });

  // Score
  ctx.fillStyle="white";
  ctx.font="16px monospace";
  ctx.fillText("Score: "+score,20,20);

  // Game Over
  if(gameOver){
    ctx.fillStyle="yellow";
    ctx.font="24px monospace";
    ctx.fillText("GAME OVER",130,200);
    ctx.font="14px monospace";
    ctx.fillText("Click to Restart",140,230);
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
