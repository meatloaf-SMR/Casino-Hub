<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whack-A-Mole</title>
<style>
  body { background:#0b1924; display:flex; justify-content:center; align-items:center; height:100vh; }
  canvas { background:#0f5b30; border:6px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="400"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let holes=[],moles=[],score=0,misses=0;

for(let r=0;r<2;r++){
  for(let c2=0;c2<3;c2++){
    holes.push({x:100+c2*120,y:100+r*120});
  }
}

function spawnMole(){
  const hole=holes[Math.floor(Math.random()*holes.length)];
  moles.push({x:hole.x,y:hole.y,up:true,t:Date.now()});
}

c.addEventListener("click",e=>{
  const rect=c.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  moles.forEach(m=>{
    if(m.up&&Math.hypot(mx-m.x,my-m.y)<40){
      m.up=false;score++;
    }
  });
});

function update(){
  if(Math.random()<0.02)spawnMole();
  moles=moles.filter(m=>{
    if(Date.now()-m.t>1500){
      if(m.up){misses++;}return false;
    }
    return true;
  });
  if(misses>=5){alert("Game Over! Score:"+score);score=0;misses=0;moles=[];}
}

function draw(){
  ctx.clearRect(0,0,500,400);
  ctx.fillStyle="white";ctx.fillText("Score:"+score+" Misses:"+misses,20,20);
  holes.forEach(h=>{
    ctx.fillStyle="#222";ctx.beginPath();ctx.arc(h.x,h.y,40,0,Math.PI*2);ctx.fill();
  });
  moles.forEach(m=>{
    if(m.up){
      ctx.fillStyle="brown";ctx.beginPath();ctx.arc(m.x,m.y-20,30,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="black";ctx.beginPath();ctx.arc(m.x-10,m.y-25,5,0,Math.PI*2);ctx.arc(m.x+10,m.y-25,5,0,Math.PI*2);ctx.fill();
    }
  });
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
